<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MoneyWise Gen Z · Challenge Lab</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet"><style>body{font-family:'DM Sans',sans-serif;background:#f7f9fc;color:#14213d}h1,h2,h3,.display{font-family:Outfit,sans-serif}.tab.active{background:#1e40af;color:white}.choice{border:1px solid #dce4ef}.choice:hover{border-color:#3b82f6;background:#eff6ff}.choice.selected{border-color:#2563eb;background:#eff6ff}.choice:disabled{opacity:.8;cursor:default}.panel{background:white;border:1px solid #e5eaf2;border-radius:18px}.btn{background:#1d4ed8;color:white;border-radius:11px;padding:11px 18px;font-weight:700}.btn:disabled{opacity:.4}.muted{color:#61718c}button:focus-visible,input:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}</style></head><body><div class="max-w-5xl mx-auto px-4 py-8"><header class="flex flex-wrap justify-between items-center gap-4 mb-8"><div><div class="text-xs tracking-widest uppercase font-bold text-blue-700">Student-led financial literacy</div><h1 class="display text-4xl font-extrabold mt-1">MoneyWise <span class="text-blue-700">Gen Z</span></h1><p class="muted mt-1">Real decisions. Smarter money habits. Grades 6–8.</p></div><div class="panel px-5 py-3"><div class="text-xs muted">Your learning progress</div><div id="topProgress" class="display text-xl font-bold">0 / 30</div></div></header><nav id="nav" aria-label="Sections" class="flex gap-2 overflow-x-auto pb-3 mb-5"></nav><main id="main" aria-live="polite"></main><footer class="text-xs muted text-center py-8">Educational simulations only · No account or real money required · Progress stays in this browser</footer></div><script>
const FALLBACK={questions:[],scenarios:[],faqs:[]};let data={...FALLBACK};const KEY='moneywise-v2-progress';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{quiz:{},scenarios:{},feedback:[]}}catch{state={quiz:{},scenarios:{},feedback:[]}};state.quiz??={};state.scenarios??={};state.feedback??=[];let tab='home',qIndex=0,sIndex=0,faqSearch='';const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{alert('Browser storage is unavailable; progress may not persist.')}updateTop()};function updateTop(){let n=Object.keys(state.quiz).length+Object.keys(state.scenarios).length;$('#topProgress').textContent=`${n} / 30 completed`};function btn(t,label){return `<button class="tab whitespace-nowrap rounded-xl px-4 py-2 font-semibold text-sm ${tab===t?'active':'bg-white border border-slate-200'}" data-tab="${t}">${label}</button>`};function nav(){ $('#nav').innerHTML=[['home','Overview'],['quiz','Quiz · 20'],['scenarios','Decisions · 10'],['faqs','FAQs · 20'],['workshop','Workshop'],['feedback','Feedback']].map(x=>btn(...x)).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()})};const box=(s)=>`<section class="panel p-6 md:p-8">${s}</section>`;const stat=(n,t)=>`<div class="rounded-xl bg-slate-50 p-4"><div class="display text-2xl font-bold">${n}</div><div class="muted text-sm">${t}</div></div>`;
function home(){let qc=Object.keys(state.quiz).length,sc=Object.keys(state.scenarios).length,correct=Object.values(state.quiz).filter((a,i)=>{let id=Object.keys(state.quiz)[i];return data.questions.find(q=>q.id===id)?.answer===a}).length;return box(`<div class="max-w-2xl"><div class="text-xs font-bold text-blue-700 uppercase tracking-wider mb-2">Welcome to Challenge Lab</div><h2 class="display text-3xl font-bold mb-3">Learn money by making choices.</h2><p class="muted mb-6">Practice with 20 bite-sized questions and 10 realistic situations. Your progress stays on this device. No signup needed.</p></div><div class="grid sm:grid-cols-3 gap-3 mb-7">${stat(qc+'/20','Quiz answered')}${stat(sc+'/10','Decisions explored')}${stat(qc?Math.round(correct/qc*100)+'%':'—','Quiz accuracy')}</div><div class="flex flex-wrap gap-3"><button class="btn" data-go="quiz">Start the quiz →</button><button class="btn !bg-slate-800" data-go="scenarios">Explore decisions →</button></div><div class="mt-7 border-t pt-5 text-sm muted">Tip: Review the explanation after each choice. The goal is to understand tradeoffs, not to be perfect.</div>`)}
function quiz(){let q=data.questions[qIndex];if(!q)return box('Quiz data unavailable. Serve the folder with a local web server.');let a=state.quiz[q.id],answered=a!==undefined;return box(`<div class="flex justify-between items-center gap-2 mb-4"><span class="text-sm font-bold text-blue-700">QUIZ · QUESTION ${qIndex+1} OF ${data.questions.length}</span><span class="muted text-sm">${Object.keys(state.quiz).length} answered</span></div><div class="bg-slate-100 h-2 rounded-full mb-6"><div class="bg-blue-600 h-2 rounded-full" style="width:${(qIndex+1)/data.questions.length*100}%"></div></div><h2 class="display text-2xl font-bold mb-6">${esc(q.question)}</h2><div class="grid gap-3">${q.options.map((o,i)=>`<button data-answer="${i}" ${answered?'disabled':''} class="choice text-left rounded-xl p-4 ${a===i?'selected':''}"><span class="font-bold mr-3 text-blue-700">${'ABCD'[i]}.</span>${esc(o)}${answered&&i===q.answer?' <span class="text-green-700 font-bold ml-2">✓</span>':''}</button>`).join('')}</div>${answered?`<div class="rounded-xl mt-5 p-4 ${a===q.answer?'bg-green-50':'bg-amber-50'}"><strong>${a===q.answer?'Correct!':'Good attempt — keep learning.'}</strong><p class="mt-1">${esc(q.explanation)}</p></div>`:''}<div class="flex justify-between items-center gap-3 mt-7"><button class="px-4 py-2 border rounded-lg" data-prev="quiz" ${qIndex===0?'disabled':''}>← Previous</button><button class="btn" data-next="quiz" ${qIndex===19?'disabled':''}>Next →</button></div>`)}
function scenarios(){let s=data.scenarios[sIndex];if(!s)return box('Scenario data unavailable.');let a=state.scenarios[s.id],answered=a!==undefined;return box(`<div class="flex justify-between mb-4 text-sm"><span class="font-bold text-blue-700">DECISION ${sIndex+1} OF 10</span><span class="muted">Explore the tradeoffs</span></div><h2 class="display text-2xl font-bold mb-3">${esc(s.title)}</h2><p class="text-lg mb-6">${esc(s.situation)}</p><div class="grid gap-3">${s.choices.map((o,i)=>`<button class="choice text-left p-4 rounded-xl ${a===i?'selected':''}" data-decision="${i}" ${answered?'disabled':''}><span class="font-bold text-blue-700 mr-2">${i+1}.</span>${esc(o)}</button>`).join('')}</div>${answered?`<div class="bg-blue-50 rounded-xl p-4 mt-5"><strong>${a===s.best?'Strong choice!':'Consider another approach.'}</strong><p class="mt-2">${esc(s.explanation)}</p><p class="text-sm mt-2 muted">Reflect: ${esc(s.reflection)}</p></div>`:''}<div class="flex justify-between mt-7 gap-3"><button class="border rounded-lg px-4 py-2" data-prev="scenarios" ${sIndex===0?'disabled':''}>← Previous</button><button class="btn" data-next="scenarios" ${sIndex===9?'disabled':''}>Next →</button></div>`)}
function faqs(){let f=data.faqs.filter(x=>(x.question+' '+x.answer).toLowerCase().includes(faqSearch.toLowerCase()));return box(`<h2 class="display text-2xl font-bold mb-2">Money questions, simple answers</h2><p class="muted mb-5">20 age-appropriate FAQs about spending, saving, and smart decisions.</p><input id="searchFaq" class="border rounded-xl w-full p-3 mb-5" placeholder="Search a topic…" value="${esc(faqSearch)}" aria-label="Search FAQs"><div id="faqResults">${faqList(f)}</div>`)}function faqList(f){return f.length?f.map(x=>`<details class="border-b py-4"><summary class="cursor-pointer font-semibold">${esc(x.question)}</summary><p class="muted mt-2">${esc(x.answer)}</p></details>`).join(''):'<p class="muted">No matching questions.</p>'}
function workshop(){return box(`<h2 class="display text-2xl font-bold mb-3">45-minute pilot workshop</h2><p class="muted mb-5">For 10–20 middle school students. Two student facilitators plus a venue-approved adult supervisor.</p><div class="grid gap-3">${[['0–5 min','Welcome + baseline quiz','Use five questions before teaching.'],['5–12 min','Money mindset','Discuss needs, wants, and social pressure.'],['12–27 min','Decision lab','Explore birthday money and weekly budget scenarios.'],['27–37 min','Mini business','Calculate revenue, costs, and profit in small groups.'],['37–42 min','Repeat quiz + reflect','Use the same five questions to compare learning.'],['42–45 min','Anonymous feedback','Collect usefulness rating and suggestions.']].map(x=>`<div class="flex gap-4 border-b pb-3"><strong class="text-blue-700 w-24 shrink-0">${x[0]}</strong><div><strong>${x[1]}</strong><p class="muted text-sm">${x[2]}</p></div></div>`).join('')}</div><p class="mt-5 text-sm muted">For formal pre/post measurement, use the same five selected quiz questions on separate paper or an approved anonymous form; this app's practice quiz is not a validated assessment.</p>`)}
function feedback(){return box(`<h2 class="display text-2xl font-bold mb-2">Help improve MoneyWise</h2><p class="muted mb-5">Anonymous feedback saved only in this browser. A facilitator can export it as JSON. Do not enter names or identifying information.</p><form id="feedbackForm" class="grid gap-4 max-w-xl"><label class="font-semibold">How useful was this activity?<select name="rating" required class="block border rounded-lg p-3 w-full mt-2"><option value="">Select rating</option>${[1,2,3,4,5].map(n=>`<option value="${n}">${n} / 5</option>`).join('')}</select></label><label class="font-semibold">Which part did you like most?<select name="favorite" class="block border rounded-lg p-3 w-full mt-2"><option>Quiz</option><option>Decision challenges</option><option>FAQs</option><option>Workshop</option></select></label><label class="font-semibold">One improvement (optional)<textarea name="suggestion" maxlength="300" rows="3" class="block border rounded-lg p-3 w-full mt-2" placeholder="No personal information, please"></textarea></label><button class="btn" type="submit">Save anonymous feedback</button></form><div class="mt-7 flex flex-wrap gap-3"><button id="export" class="border rounded-lg px-4 py-2 font-semibold">Export progress & feedback JSON</button><button id="reset" class="border border-red-200 text-red-700 rounded-lg px-4 py-2 font-semibold">Clear this device's data</button></div><p class="muted text-sm mt-3">Feedback records on different devices are not automatically combined. Export and aggregate them with appropriate consent.</p><div id="feedbackMessage" class="mt-4 text-green-700 font-semibold" role="status"></div>`)}
function render(){nav();updateTop();$('#main').innerHTML=({home,quiz,scenarios,faqs,workshop,feedback})[tab]();document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{tab=b.dataset.go;render()});document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{let q=data.questions[qIndex];if(state.quiz[q.id]===undefined){state.quiz[q.id]=Number(b.dataset.answer);save();render()}});document.querySelectorAll('[data-decision]').forEach(b=>b.onclick=()=>{let s=data.scenarios[sIndex];if(state.scenarios[s.id]===undefined){state.scenarios[s.id]=Number(b.dataset.decision);save();render()}});document.querySelectorAll('[data-prev]').forEach(b=>b.onclick=()=>{if(b.dataset.prev==='quiz')qIndex--;else sIndex--;render()});document.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>{if(b.dataset.next==='quiz')qIndex++;else sIndex++;render()});if(tab==='faqs')$('#searchFaq').oninput=e=>{faqSearch=e.target.value;$('#faqResults').innerHTML=faqList(data.faqs.filter(x=>(x.question+' '+x.answer).toLowerCase().includes(faqSearch.toLowerCase())))};if(tab==='feedback'){ $('#feedbackForm').onsubmit=e=>{e.preventDefault();let fd=new FormData(e.target);state.feedback.push({rating:Number(fd.get('rating')),favorite:String(fd.get('favorite')),suggestion:String(fd.get('suggestion')).slice(0,300)});save();e.target.reset();$('#feedbackMessage').textContent='Feedback saved on this device.'};$('#export').onclick=()=>{let blob=new Blob([JSON.stringify({app:'MoneyWise Gen Z',version:'2.0',progress:state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='moneywise-anonymous-export.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('#reset').onclick=()=>{if(confirm('Clear all quiz answers, decisions, and feedback on this device?')){state={quiz:{},scenarios:{},feedback:[]};save();render()}}}}
Promise.all(['questions','scenarios','faqs'].map(async k=>{let r=await fetch('data/'+k+'.json');if(!r.ok)throw Error(k+' not found');data[k]=await r.json()})).then(render).catch(e=>{$('#main').innerHTML=box(`<h2 class="font-bold">Unable to load learning data</h2><p>${esc(e.message)}</p><p class="mt-2">Run a local HTTP server or publish the complete folder to GitHub Pages. Opening index.html directly using file:// may block JSON fetches.</p>`);nav();updateTop()});
</script></body></html>
