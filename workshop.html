<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MoneyWise Gen Z | Workshop Kit</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet"><style>body{font-family:'DM Sans',sans-serif;background:#f8fafc;color:#17243d}h1,h2,h3{font-family:Outfit,sans-serif}.panel{background:white;border:1px solid #e2e8f0;border-radius:18px}.btn{background:#1d4ed8;color:white;border-radius:10px;padding:10px 16px;font-weight:700}.outline{border:1px solid #cbd5e1;border-radius:10px;padding:10px 15px}.active{background:#dbeafe;color:#1d4ed8}.answer{display:none}.reveal .answer{display:block}button:focus-visible,input:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}.slide{min-height:310px}.small{color:#64748b}.printonly{display:none}@media print{.noprint,nav,button{display:none!important}body{background:white;font-size:11pt}.panel{border:0;border-radius:0;box-shadow:none}.printonly{display:block}.sheet{break-after:page;padding:12mm}.sheet:last-child{break-after:auto}.answer{display:none!important}.print-answer .answer{display:block!important}#content{display:none!important}#printpack{display:block!important}header{display:none!important}} </style></head><body><div class="max-w-5xl mx-auto px-4 py-7"><header class="flex flex-wrap items-start justify-between gap-3 mb-6"><div><div class="text-xs uppercase tracking-widest font-bold text-blue-700">Student-led facilitator toolkit · Grades 6–8</div><h1 class="text-3xl font-extrabold mt-1">MoneyWise Gen Z <span class="text-blue-700">Workshop</span></h1><p class="small mt-1">45 minutes · no student accounts · designed for a 10–20 learner pilot</p></div><a href="index.html" class="outline noprint">← Back to Challenge Lab</a></header><nav class="flex flex-wrap gap-2 mb-5 noprint" id="nav"></nav><main id="content" class="panel p-5 md:p-8"></main><div id="printpack" class="printonly"></div><footer class="text-center small text-xs mt-8 noprint">MoneyWise Gen Z · educational activities, not individualized financial advice · no names needed</footer></div><script>
const agenda=[['0–5','Welcome + pre-assessment','Introduce goals, distribute five-question pre-test. No coaching yet.'],['5–12','Money mindset','Needs vs wants; ads and peer pressure; money decisions are tradeoffs.'],['12–27','Decision Lab','Teams work through $100 birthday gift and $50 weekly budget. Use app or printed worksheet.'],['27–37','Mini Business','Teams calculate sales, costs, and profit for bookmarks.'],['37–42','Post-assessment + reflection','Repeat same five questions independently, then discuss one takeaway.'],['42–45','Feedback + closing','Anonymous rating, one improvement; explain optional next steps.']];
const slides=[{tag:'WELCOME',title:'Every dollar is a decision',body:'You do not need a paycheck to practice smart money choices.',ask:'If you received $100 today, what would you do first?',note:'Invite 2–3 answers without judging. Explain that the session is practice, not a test of anyone’s family finances.'},{tag:'MINDSET',title:'Need, want, or both?',body:'A need supports basic living or an important obligation. A want is something you would enjoy but can often delay.',ask:'Can the same item be a need for one person and a want for another?',note:'Examples: winter coat, new game, bus fare, replacement shoes. Allow context-specific answers.'},{tag:'MINDSET',title:'Who influences your spending?',body:'Friends, ads, influencers, discounts, and emotions can shape what we buy.',ask:'What question could you ask before an impulse purchase?',note:'Invite: Do I need it? Can I afford it? What goal would I delay?'},{tag:'SIMULATION 1',title:'The $100 birthday challenge',body:'You receive $100. You want to save $60 for a school trip. Sneakers cost $80; a game costs $20.',ask:'What options leave your $60 goal possible?',note:'Buying the $20 game leaves $80, enough to save $60. Saving all $100 also meets the goal. Buying $80 sneakers leaves $20.'},{tag:'SIMULATION 2',title:'Make a $50 weekly plan',body:'You have $50. School supplies cost $20. You hope to save $15.',ask:'How much could you spend on entertainment and still meet both goals?',note:'$50 − $20 − $15 = $15. Discuss what changes if an unexpected cost appears.'},{tag:'BUSINESS',title:'Start a bookmark business',body:'Supplies cost $30 for 20 bookmarks. You sell all 20 for $3 each.',ask:'What are revenue, supply costs, and profit?',note:'Revenue = 20 × $3 = $60. Profit = $60 − $30 = $30 before other costs. If fewer sell, profit changes.'},{tag:'REFLECT',title:'There is no magic money trick',body:'Plan, compare, pause, and learn. Different families have different priorities.',ask:'What is one money decision you will approach differently?',note:'Avoid asking learners to reveal household income, debt, or family financial problems.'},{tag:'WRAP-UP',title:'Your next smart money move',body:'Try a one-week spending diary using imaginary or real small purchases—no personal details shared.',ask:'What would you tell a friend before a big purchase?',note:'Distribute post-test and anonymous feedback. Thank learners; no public rankings.'}];
const quiz=[{q:'You have $40 and must buy $25 of school supplies. What is the most you can spend on a game without borrowing?',a:['$10','$15','$25','$40'],k:1,why:'$40 − $25 = $15.'},{q:'Which is an example of opportunity cost?',a:['The sales tax on a purchase','What you give up when choosing one option','Money received as a gift','A store discount'],k:1,why:'Opportunity cost is the next-best alternative you give up.'},{q:'You save $5 each week for 6 weeks. How much have you saved, assuming no withdrawals or interest?',a:['$11','$25','$30','$35'],k:2,why:'6 × $5 = $30.'},{q:'A business sells 10 bracelets for $4 each. Materials cost $18 in total, with no other costs. What is profit?',a:['$18','$22','$40','$58'],k:1,why:'Revenue $40 minus costs $18 = $22.'},{q:'Which action best supports a savings goal?',a:['Spend first and hope money remains','Ignore the goal until next year','Set aside a planned amount regularly','Buy more when items are on sale'],k:2,why:'A consistent planned amount makes progress easier to track.'}];
const worksheet=[['Challenge A: Birthday money','You receive $100 and want to save $60 for a school trip. List two choices that meet your goal. What must you give up?'],['Challenge B: Weekly budget','You have $50. Supplies cost $20; savings goal is $15. What is the maximum entertainment budget? What if supplies cost $25 instead?'],['Challenge C: Mini business','Supplies: $30 for 20 bookmarks. Price: $3 each. Calculate revenue and profit if you sell 20. Then calculate profit if you sell only 12. Assume no other costs.']];
let tab='guide',idx=0,shown=false;const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function nav(){ $('#nav').innerHTML=[['guide','Facilitator guide'],['slides','Presentation slides'],['activities','Group activities'],['assessment','Pre/post assessment'],['feedback','Feedback & results'],['print','Print kit']].map(([k,v])=>`<button class="outline ${tab===k?'active':''}" data-tab="${k}">${v}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()})}
function guide(){return `<h2 class="text-2xl font-bold mb-2">Facilitator run of show</h2><p class="small mb-5">Audience: grades 6–8. Team: lead student presenter, student activity helper, venue-approved adult supervisor. Materials: projector (optional), worksheets, pens, timer, and one device per group if available.</p><div class="space-y-3">${agenda.map(a=>`<div class="border-b pb-3 flex gap-4"><div class="w-20 shrink-0 font-bold text-blue-700">${a[0]} min</div><div><h3 class="font-bold">${a[1]}</h3><p class="small text-sm">${a[2]}</p></div></div>`).join('')}</div><div class="mt-5 bg-blue-50 rounded-xl p-4"><b>Opening script:</b> “Today we will practice choices with pretend money. There is no need to share what your family earns or spends. Different choices can be reasonable depending on your goals.”<br><br><b>Facilitation tips:</b> Ask “Why?” rather than “Who got it right?” Give 20–30 seconds of think time; invite multiple perspectives; keep examples age-appropriate; never ask about family debt or income.</div><div class="mt-5"><h3 class="font-bold">Before students arrive</h3><ul class="list-disc pl-6 mt-2 space-y-1"><li>Confirm venue permission, supervision, room setup, accessibility, and technology.</li><li>Print pre- and post-tests separately; use anonymous matching codes if permitted.</li><li>Check that <a class="text-blue-700 underline" href="index.html">Challenge Lab</a> loads over HTTP and that JSON content appears.</li><li>Prepare a paper fallback if internet or devices fail.</li><li>Do not photograph, identify, or collect contact details of minors without appropriate permission.</li></ul></div>`}
function slidesView(){let s=slides[idx];return `<div class="flex items-center justify-between mb-4"><span class="text-sm font-bold text-blue-700">SLIDE ${idx+1} / ${slides.length} · ${s.tag}</span><button class="outline" id="toggleNotes">${shown?'Hide':'Show'} speaker notes</button></div><section class="slide rounded-2xl bg-gradient-to-br from-blue-50 to-white border border-blue-100 p-6 md:p-10 flex flex-col justify-center"><h2 class="text-3xl md:text-5xl font-extrabold mb-5">${s.title}</h2><p class="text-lg md:text-2xl max-w-2xl">${s.body}</p><div class="mt-7 border-l-4 border-blue-600 pl-4 text-blue-900 font-semibold">Ask students: ${s.ask}</div></section>${shown?`<div class="mt-4 p-4 rounded-xl bg-amber-50"><b>Facilitator notes:</b> ${s.note}</div>`:''}<div class="flex justify-between mt-5"><button class="outline" id="prev" ${idx===0?'disabled':''}>← Previous</button><button class="btn" id="next" ${idx===slides.length-1?'disabled':''}>Next slide →</button></div>`}
function activities(){return `<h2 class="text-2xl font-bold mb-3">Three group challenges</h2><p class="small mb-5">Groups of 2–4 students. Give each group a worksheet. Allow 3–4 minutes per challenge and ask for a short explanation.</p>${worksheet.map((w,i)=>`<div class="border rounded-xl p-4 mb-3"><div class="font-bold text-blue-700">0${i+1} · ${w[0]}</div><p class="mt-2">${w[1]}</p><details class="mt-3 text-sm"><summary class="font-semibold cursor-pointer">Facilitator answer / discussion</summary><p class="small mt-2">${['Saving $60 or more meets the goal. A $20 game plus $80 remaining also works. $80 sneakers leave only $20. Ask about tradeoffs, not shame.','Maximum entertainment: $15. If supplies rise to $25, maximum entertainment becomes $10 if the $15 savings goal stays fixed.','20 sold: revenue $60, profit $30. 12 sold: revenue $36, profit $6 if all $30 supplies were purchased.'][i]}</p></details></div>`).join('')}`}
function assessment(){return `<h2 class="text-2xl font-bold mb-2">Five-question assessment</h2><p class="small mb-4">Use the same questions before and after. Give no answers until the post-test is complete. Each correct response earns 1 point (0–5).</p>${quiz.map((q,i)=>`<div class="border-b py-4"><b>${i+1}. ${q.q}</b><div class="grid sm:grid-cols-2 gap-1 mt-2 text-sm">${q.a.map((a,j)=>`<div>${'ABCD'[j]}. ${a}</div>`).join('')}</div></div>`).join('')}<details class="mt-5 bg-slate-50 rounded-xl p-4"><summary class="font-semibold cursor-pointer">Facilitator-only answer key</summary>${quiz.map((q,i)=>`<p class="text-sm mt-2">${i+1}. ${'ABCD'[q.k]} — ${q.why}</p>`).join('')}</details>`}
function feedback(){return `<h2 class="text-2xl font-bold mb-3">Feedback and learning outcomes</h2><p class="small mb-5">Use anonymous paper feedback. Enter only aggregate counts below; no student names or contact information.</p><div class="grid sm:grid-cols-2 gap-4"><label class="font-semibold text-sm">Students with matched pre/post tests<input id="n" type="number" min="0" value="12" class="block w-full border rounded-lg p-3 mt-2"></label><label class="font-semibold text-sm">Total correct on pre-tests (max 5 per student)<input id="pre" type="number" min="0" value="30" class="block w-full border rounded-lg p-3 mt-2"></label><label class="font-semibold text-sm">Total correct on post-tests<input id="post" type="number" min="0" value="45" class="block w-full border rounded-lg p-3 mt-2"></label><label class="font-semibold text-sm">Average usefulness rating (1–5)<input id="rating" type="number" min="1" max="5" step="0.1" value="4.2" class="block w-full border rounded-lg p-3 mt-2"></label></div><p class="text-xs small mt-3">Sample numbers are placeholders. Replace with actual pilot totals.</p><button class="btn mt-4" id="calc">Calculate results</button><div id="results" class="mt-4" aria-live="polite"></div><div class="mt-6 bg-slate-50 p-4 rounded-xl"><b>Exit ticket (anonymous):</b><ol class="list-decimal pl-5 mt-2 text-sm space-y-1"><li>How useful was today’s workshop? (1–5)</li><li>What was the most helpful activity?</li><li>What was confusing or should change?</li><li>What is one money habit you want to try?</li></ol></div>`}
function printView(){return `<h2 class="text-2xl font-bold mb-2">Print-ready workshop packet</h2><p class="small mb-4">Print the facilitator guide, one worksheet per group, and two copies of the assessment per student (pre and post). Keep the answer key with facilitators only.</p><div class="flex flex-wrap gap-3"><button class="btn" id="printAll">Print learner packet</button><button class="outline" id="printKey">Print facilitator packet with key</button></div><p class="small text-sm mt-5">Tip: Select “Save as PDF” in the browser print dialog to share the workshop materials with your venue.</p>`}
function printPack(withKey){let assessment=(label)=>`<section class="sheet"><h1 style="font-size:24pt;font-weight:bold">MoneyWise Gen Z · ${label}</h1><p>Anonymous matching code (optional): _____________ &nbsp; Date: __________</p><p>Circle one answer for each question. Do not write your name.</p>${quiz.map((q,i)=>`<div style="margin-top:18px"><b>${i+1}. ${q.q}</b><div>${q.a.map((a,j)=>`<span style="display:inline-block;margin:8px 15px 4px 0">${'ABCD'[j]}. ${a}</span>`).join('')}</div></div>`).join('')}</section>`;$('#printpack').innerHTML=`<section class="sheet"><h1 style="font-size:24pt;font-weight:bold">MoneyWise Gen Z · Facilitator Guide</h1><p>Grades 6–8 · 45 minutes · 10–20 participants · student-led with approved adult supervisor</p>${agenda.map(a=>`<p style="margin:15px 0"><b>${a[0]} min — ${a[1]}</b><br>${a[2]}</p>`).join('')}<p><b>Ground rules:</b> No personal or family financial disclosures. Use pretend money. Discuss tradeoffs without shame. Use a paper backup.</p></section><section class="sheet"><h1 style="font-size:24pt;font-weight:bold">Money Decision Lab · Group Worksheet</h1><p>Group number (optional): _______</p>${worksheet.map((w,i)=>`<div style="margin:25px 0"><b>${i+1}. ${w[0]}</b><p>${w[1]}</p><div style="border-bottom:1px solid #94a3b8;height:35px"></div><div style="border-bottom:1px solid #94a3b8;height:35px"></div></div>`).join('')}</section>${assessment('Pre-test')}${assessment('Post-test')}<section class="sheet"><h1 style="font-size:24pt;font-weight:bold">Anonymous Workshop Feedback</h1><p>How useful was this workshop? Circle: 1 &nbsp; 2 &nbsp; 3 &nbsp; 4 &nbsp; 5</p><p>Which activity helped you most? ________________________________</p><p>What was confusing or could improve?</p><div style="height:65px;border-bottom:1px solid #94a3b8"></div><p>One money habit I want to practice:</p><div style="height:65px;border-bottom:1px solid #94a3b8"></div></section>${withKey?`<section class="sheet"><h1 style="font-size:24pt;font-weight:bold">Facilitator answer key · Keep private</h1>${quiz.map((q,i)=>`<p style="margin:18px 0"><b>${i+1}. ${'ABCD'[q.k]}</b> — ${q.why}</p>`).join('')}<p><b>Group worksheet:</b> Birthday: save at least $60. Weekly budget: $15 entertainment, or $10 if supplies increase to $25. Bookmarks: $30 profit for 20 sold; $6 profit for 12 sold, assuming $30 supply cost and no other costs.</p></section>`:''}`;window.print()}
function render(){nav();$('#content').innerHTML=({guide,slides:slidesView,activities,assessment,feedback,print:printView})[tab]();if(tab==='slides'){$('#prev').onclick=()=>{idx=Math.max(0,idx-1);render()};$('#next').onclick=()=>{idx=Math.min(slides.length-1,idx+1);render()};$('#toggleNotes').onclick=()=>{shown=!shown;render()}}if(tab==='print'){$('#printAll').onclick=()=>printPack(false);$('#printKey').onclick=()=>printPack(true)}if(tab==='feedback'){$('#calc').onclick=()=>{let n=Number($('#n').value),pre=Number($('#pre').value),post=Number($('#post').value),rating=Number($('#rating').value);if(!Number.isInteger(n)||n<=0||![pre,post,rating].every(Number.isFinite)||pre<0||post<0||pre>n*5||post>n*5||rating<1||rating>5){$('#results').textContent='Enter valid counts and a rating from 1 to 5.';return}let a=100*pre/(5*n),b=100*post/(5*n);$('#results').innerHTML=`<div class="bg-blue-50 p-4 rounded-xl"><b>Pre-test:</b> ${a.toFixed(1)}% · <b>Post-test:</b> ${b.toFixed(1)}% · <b>Change:</b> ${(b-a).toFixed(1)} percentage points · <b>Usefulness:</b> ${rating.toFixed(1)}/5 <p class="text-xs small mt-2">Descriptive pilot results only. These do not establish long-term learning or causal impact.</p></div>`}}}render();
</script></body></html>
